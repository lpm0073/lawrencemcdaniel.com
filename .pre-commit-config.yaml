default_language_version:
  node: 23.3.0

repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ['--ignore-words=codespell.txt', '--skip=yarn.lock']
        exclude: '\.svg$'
  # The project's own Prettier and ESLint (and their configuration in package.json and
  # eslint.config.js), so that the hooks and `yarn format` / `yarn lint` always agree.
  # They need node_modules: run `yarn install` first.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --write --ignore-unknown
        language: system
        exclude: ^(public/sitemap\.xml|CHANGELOG\.md)$
      - id: eslint
        name: eslint
        entry: npx --no-install eslint --max-warnings=0 --no-warn-ignored
        language: system
        files: \.(ts|tsx|js|cjs)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # See https://pre-commit.com/hooks.html for more hooks
      #- id: check-added-large-files
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-xml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-aws-credentials
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^public/sitemap\.xml$
      - id: forbid-new-submodules
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-angular']
ci:
  # for more information, see https://pre-commit.ci
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [shellcheck, markdown-link-check, commitlint, prettier, eslint]
  submodules: false
