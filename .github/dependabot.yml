version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    labels:
      - 'dependencies'
      - 'javascript'
      - 'automated pr'
    schedule:
      interval: 'monthly'
    assignees:
      - 'lpm0073'
    reviewers:
      - 'lpm0073'
  - package-ecosystem: 'github-actions'
    # '/' covers .github/workflows; the composite actions need their own entry.
    directories:
      - '/'
      - '/.github/actions/*'
    labels:
      - 'dependencies'
      - 'automated pr'
    schedule:
      interval: 'monthly'
    assignees:
      - 'lpm0073'
    reviewers:
      - 'lpm0073'
