---
#---------------------------------------------------------
# - Merge main into next
#
# The release itself (semantic-release) runs in deploy.yml,
# between the tests and the deploy.
#---------------------------------------------------------
name: Push to main

on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  merge-main-to-dev-branches:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v5

      - name: Merge main into next
        uses: ./.github/actions/merge-branch
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
          source-branch: main
          target-branch: next
